<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial; background: #eef1f6; display: flex; justify-content: center; padding-top: 80px; }
        .box { background: white; padding: 30px; width: 300px; border-radius: 8px; box-shadow: 0 2px 10px #aaa; }
        input { width: 100%; padding: 9px; margin: 6px 0 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2f6fed; color: white; border: none; border-radius: 5px; }
        .error { background: #fdecea; color: #c62828; padding: 8px; margin-bottom: 12px; border-radius: 5px; }
        p { text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Register</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username">

            <label>Password</label>
            <input type="password" name="password">

            <label>Confirm Password</label>
            <input type="password" name="confirm">

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
